# Flathub manifest for TypingMaster (generated by scripts/make-flathub.sh;
# edit the main manifest / files/ and regenerate instead of editing this).
#
# TypingMaster is proprietary: the program files are downloaded from
# typingmaster.com at install time (extra-data) and unpacked by apply_extra.
#
# --allow=multiarch: TypingMaster.exe is a 32-bit Windows program.
# --allow=devel: the exe protector around TypingMaster.exe needs system
#   calls the sandbox otherwise blocks; without it the program exits ~2 s
#   after start ("stack overflow" in the Wine log). The Wine base
#   (org.winehq.Wine) declares devel as well.

app-id: com.typingmaster.TypingMaster
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.winehq.Wine
base-version: stable-26.08
command: typingmaster
finish-args:
- --socket=x11
- --share=ipc
- --socket=pulseaudio
- --share=network
- --socket=cups
- --filesystem=xdg-desktop
- --filesystem=xdg-documents
- --filesystem=xdg-download
- --allow=multiarch
- --allow=devel
- --env=WINEDLLOVERRIDES=winemenubuilder.exe=d;mscoree=d
inherit-extensions:
- org.winehq.Wine.gecko
modules:
- name: selawik
  buildsystem: simple
  build-commands:
  - install -Dm644 -t /app/share/fonts/selawik selawk*.ttf
  - install -Dm644 LICENSE.txt /app/share/licenses/com.typingmaster.TypingMaster/selawik/LICENSE.txt
  sources:
  - type: archive
    url: https://github.com/microsoft/Selawik/releases/download/1.01/Selawik_Release.zip
    sha256: 3f62c51e05e3b5a1e6241cf92a371f0be2ea1183aa87b30718bbd40832a8d423
    strip-components: 0
  - type: file
    url: https://raw.githubusercontent.com/microsoft/Selawik/1.01/LICENSE.txt
    sha256: 77b7c2506d4efb22e09c8ccf10159f4956eab3ef7c007fef95de136bcf45300c
- name: typingmaster
  buildsystem: simple
  build-commands:
  - install -Dm755 typingmaster.sh /app/bin/typingmaster
  - install -Dm755 apply_extra.py /app/bin/apply_extra
  - install -Dm644 -t /app/share/typingmaster wine-settings.reg screen-size.py unpack_zip.py exclude-files.txt
    package-build-id
  - install -Dm644 com.typingmaster.TypingMaster.desktop -t /app/share/applications
  - install -Dm644 com.typingmaster.TypingMaster.metainfo.xml -t /app/share/metainfo
  - for s in 48 64 128 256; do install -Dm644 icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/com.typingmaster.TypingMaster.png;
    done
  sources:
  - type: extra-data
    filename: tm12linux-12.0.1.980.zip
    url: https://www.typingmaster.com/linux-typing-tutor/tm12linux-12.0.1.980.zip
    sha256: 636a9be7157cec71e245160f342536d911eedddec71988514dea554969b2d723
    size: 8749439
  - type: file
    path: typingmaster.sh
  - type: file
    path: apply_extra.py
  - type: file
    path: wine-settings.reg
  - type: file
    path: screen-size.py
  - type: file
    path: unpack_zip.py
  - type: file
    path: exclude-files.txt
  - type: file
    path: package-build-id
  - type: file
    path: com.typingmaster.TypingMaster.desktop
  - type: file
    path: com.typingmaster.TypingMaster.metainfo.xml
  - type: dir
    path: icons
    dest: icons
